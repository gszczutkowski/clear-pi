name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - name: Require a version increase in every PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          npm run check:version -- --base origin/main
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: clear-pi-package
          path: ${{ runner.temp }}/clear-pi-*.tgz
          if-no-files-found: error
